<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2ecb"/>
      <stop offset="100%" stop-color="#2ee6ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" fill="#0a0a12"/>

  <!-- Node network motif: central node + orbiting nodes, referencing routing/orchestration -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="46" fill="none" stroke="url(#neonGrad)" stroke-width="10"/>
    <circle cx="256" cy="256" r="14" fill="#ff2ecb"/>

    <circle cx="140" cy="160" r="22" fill="none" stroke="#2ee6ff" stroke-width="7"/>
    <circle cx="140" cy="160" r="8" fill="#2ee6ff"/>

    <circle cx="372" cy="160" r="22" fill="none" stroke="#ff2ecb" stroke-width="7"/>
    <circle cx="372" cy="160" r="8" fill="#ff2ecb"/>

    <circle cx="140" cy="352" r="22" fill="none" stroke="#ff2ecb" stroke-width="7"/>
    <circle cx="140" cy="352" r="8" fill="#ff2ecb"/>

    <circle cx="372" cy="352" r="22" fill="none" stroke="#2ee6ff" stroke-width="7"/>
    <circle cx="372" cy="352" r="8" fill="#2ee6ff"/>

    <!-- connecting lines -->
    <line x1="256" y1="256" x2="140" y2="160" stroke="url(#neonGrad)" stroke-width="4" opacity="0.8"/>
    <line x1="256" y1="256" x2="372" y2="160" stroke="url(#neonGrad)" stroke-width="4" opacity="0.8"/>
    <line x1="256" y1="256" x2="140" y2="352" stroke="url(#neonGrad)" stroke-width="4" opacity="0.8"/>
    <line x1="256" y1="256" x2="372" y2="352" stroke="url(#neonGrad)" stroke-width="4" opacity="0.8"/>
  </g>
</svg>
